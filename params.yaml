data:
  test_size: 0.2
  seed: 42

models:
  logreg:
    C: 1.0
    max_iter: 1000
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8

gate:
  min_f1: 0.52

monitoring:
  window: 500
  min_samples: 200
  min_labels: 200
  psi_warn: 0.10
  psi_crit: 0.25
  min_drifting_features: 2
  f1_drop_warn: 0.04
  f1_drop_crit: 0.08
  latency_p95_warn_ms: 200
  latency_p95_crit_ms: 300
  max_missing_share: 0.05
